<!DOCTYPE html>
<html>
<head>
    <title>Image Colorization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 60px;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        form {
            margin: 40px 0;
        }

        input[type="file"] {
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background: #ff7f50;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background: #ff5722;
        }

        .image-section {
            width: 90%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 40px;
        }

        .image-box {
            text-align: center;
        }

        .image-box h3 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .image-box img {
            width: 500px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        @media (max-width: 1000px) {
            .image-section {
                flex-direction: column;
                gap: 40px;
            }

            .image-box img {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<h1>Image Colorization</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" required>
    <button type="submit">Colorize</button>
</form>

{% if gray_image and color_image %}
<div class="image-section">

    <div class="image-box">
        <h3>Grayscale</h3>
        <img src="{{ url_for('static', filename=gray_image) }}">
    </div>

    <div class="image-box">
        <h3>Colorized</h3>
        <img src="{{ url_for('static', filename=color_image) }}">
    </div>

</div>
{% endif %}

</body>
</html>
